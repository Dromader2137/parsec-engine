[workspace]
resolver = "3"
members = ["parsec_engine", "parsec_engine_examples", "parsec_engine_macros", 
	"parsec_engine_math", "parsec_engine_vulkan"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
ash = "0.38.0"
ash-window = "0.13.0"
image = "0.25.9"
once_cell = "1.21.4"
postcard = { version = "1.1.3", features = ["use-std"] }
quote = "1.0"
serde = { version = "1.0.228", features = ["derive"] }
syn = { version = "2.0", features = ["full"] }
thiserror = "2.0.18"
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "wayland"] }
shaderc = "0.10.1"

parsec_engine = { path = "parsec_engine", version = "0.1.0" }
parsec_engine_macros = { path = "parsec_engine_macros", version = "0.1.0" }
parsec_engine_math = { path = "parsec_engine_math", version = "0.1.0" }
parsec_engine_vulkan = { path = "parsec_engine_vulkan", version = "0.1.0" }
