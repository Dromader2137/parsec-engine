[workspace]
resolver = "3"
members = ["parsec-engine", "parsec-engine-examples", "parsec-engine-macros", 
	"parsec-engine-math", "parsec-engine-vulkan"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
ash = "0.38.0"
ash-window = "0.13.0"
image = "0.25.9"
once_cell = "1.21.4"
postcard = { version = "1.1.3", features = ["use-std"] }
quote = "1.0"
serde = { version = "1.0.228", features = ["derive"] }
syn = { version = "2.0", features = ["full"] }
thiserror = "2.0.18"
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "wayland"] }
shaderc = "0.10.1"

parsec-engine = { path = "parsec-engine", version = "0.1.0" }
parsec-engine-macros = { path = "parsec-engine-macros", version = "0.1.0" }
parsec-engine-math = { path = "parsec-engine-math", version = "0.1.0" }
parsec-engine-vulkan = { path = "parsec-engine-vulkan", version = "0.1.0" }
